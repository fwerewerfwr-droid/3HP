<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Concrete Cube Testing - Result Entry (Simulation)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .header {
            background-color: #3a5a6b;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .logo {
            font-size: 48px;
            font-weight: bold;
            color: #00994d;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
        }
        .user-info {
            text-align: right;
            font-size: 14px;
        }
        .search-bar {
            background-color: #e6d07c;
            padding: 10px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            margin: 20px;
            border-radius: 4px;
        }
        .search-bar label {
            font-weight: bold;
            min-width: 80px;
        }
        .search-bar input {
            padding: 6px;
            width: 180px;
            border: 1px solid #999;
            border-radius: 3px;
        }
        .search-bar button {
            padding: 6px 12px;
            background-color: #fff;
            border: 1px solid #999;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-bar button:hover {
            background-color: #eee;
        }
        table {
            width: 95%;
            border-collapse: collapse;
            margin: 20px auto;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            font-size: 14px;
        }
        th, td {
            padding: 8px;
            text-align: center;
            border: 1px solid #ddd;
        }
        th {
            background-color: white;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 1px solid #000;
        }
        #resultsTable {
            border-top: 1px solid #000;
        }
        .red-button {
            background-color: #cc0000;
            color: white;
            border: none;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
        }
        .red-button:hover {
            background-color: #aa0000;
        }
        .checkbox {
            width: 18px;
            height: 18px;
            accent-color: #007bff;
        }
        .input-small {
            width: 25px;
            text-align: center;
            padding: 2px;
            border: 1px solid #000;
            border-radius: 0;
            font-size: 12px;
            margin: 0;
            box-sizing: border-box;
        }
        .input-medium {
            width: 60px;
            text-align: center;
            padding: 2px;
            border: 1px solid #ccc;
            border-radius: 2px;
        }
        .cube-id {
            font-weight: bold;
            text-align: left;
            padding-left: 5px;
        }
        .footer {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #777;
            margin-top: 20px;
        }
        .btn-save {
            background-color: #007bff;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin: 5px;
        }
        .btn-save:hover {
            background-color: #0056b3;
        }
        .btn-send {
            background-color: #28a745;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin: 5px;
        }
        .btn-send:hover {
            background-color: #218838;
        }
        td input {
            display: inline-block;
            margin: 0;
            padding: 2px;
            border: 1px solid #000;
            border-radius: 0;
            box-sizing: border-box;
        }
        td {
            padding: 0;
        }
        .global-nominal {
            background-color: #f9f9f9;
            padding: 4px;
            border: 1px solid #999;
            border-radius: 3px;
            font-size: 14px;
            margin-right: 10px;
        }
        .header-checkbox {
            width: 18px;
            height: 18px;
            accent-color: #007bff;
        }
        /* Estilo para campo inválido */
        .invalid {
            border: 2px solid #ff4d4d !important;
        }
        /* Alinhamento da caixa dentro da célula do Cube ID */
        .cube-cell {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .cube-cell .id-text {
            font-weight: bold;
            text-align: left;
            padding-left: 5px;
        }
        .cube-cell .nominal-input {
            width: 25px;
            text-align: center;
            padding: 2px;
            border: 1px solid #000;
            border-radius: 0;
            font-size: 12px;
            margin: 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">3HP</div>
        <div class="title">Concrete Cube Testing - Result Entry (Measurement)</div>
        <div class="user-info">
            <span id="counter">0</span>/234 cubes tested
        </div>
    </div>

    <div class="search-bar">
        <label>Cube ID:</label>
        <input type="text" id="cubeId">
        <button onclick="findCube()">Find...</button>
        <span style="flex-grow:1;"></span>
        <label>Batch ID:</label>
        <input type="text" id="batchId">
        <button onclick="lookupBatch()">Lookup...</button>
    </div>

    <div style="margin: 0 20px 10px; display: flex; align-items: center;">
        <label style="font-weight: bold; margin-right: 5px;">Nominal Value:</label>
        <select class="global-nominal" id="globalNominal" onchange="applyGlobalNominal()">
            <option value="">Select...</option>
            <option value="100">100</option>
            <option value="150">150</option>
        </select>
    </div>

    <table id="resultsTable">
        <thead>
            <tr>
                <th>Cube ID</th>
                <th colspan="3">Width</th>
                <th colspan="3">Height</th>
                <th colspan="3">Length</th>
                <th>
                    F<br>
                    <input type="checkbox" class="header-checkbox" id="selectAllF" onclick="toggleAll('F')">
                </th>
                <th>
                    P<br>
                    <input type="checkbox" class="header-checkbox" id="selectAllP" onclick="toggleAll('P')">
                </th>
                <th>Weight Air</th>
                <th>Water</th>
                <th>Release?</th>
                <th>Max Load</th>
                <th>Tested?</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>

    <div style="text-align: center; margin: 20px;">
        <button class="btn-save" onclick="saveResults()">💾 Save</button>
        <button class="btn-send" onclick="sendResults()">📤 Send</button>
    </div>

    <div class="footer">
        Simulation for training and personal improvement — © 2025 | For internal use only
    </div>

    <script>
        let cubeCount = 0;
        let currentNominal = '';

        function findCube() {
            const cubeIdInput = document.getElementById('cubeId');
            const cubeId = cubeIdInput.value.trim();

            if (cubeId === '') {
                alert('⚠️ Please enter a valid Cube ID.');
                return;
            }

            if (!cubeId.includes('.')) {
                alert('⚠️ Format expected: XXXXX.X (e.g., 01234.5)');
                return;
            }

            let strength = '40N';
            const lastPart = cubeId.split('.').pop();
            if (lastPart && !isNaN(lastPart)) {
                const num = parseInt(lastPart);
                if (num % 3 === 0) strength = '35N';
                else if (num % 5 === 0) strength = '55N';
            }

            const tbody = document.getElementById('tableBody');
            const newRow = document.createElement('tr');

            newRow.innerHTML = `
                <td class="cube-cell">
                    <div class="id-text">${cubeId}<br><small>(${strength})</small></div>
                    <input class="nominal-input" type="text" oninput="syncNominal(this)" placeholder="">
                </td>
                <!-- Width (3 caixas) -->
                <td><input class="input-small" type="text" value=""></td>
                <td><input class="input-small" type="text" value="0.00"></td>
                <td><input class="input-small" type="text" value="0.00"></td>
                <!-- Height (3 caixas) -->
                <td><input class="input-small" type="text" value=""></td>
                <td><input class="input-small" type="text" value="0.00"></td>
                <td><input class="input-small" type="text" value="0.00"></td>
                <!-- Length (3 caixas) -->
                <td><input class="input-small" type="text" value=""></td>
                <td><input class="input-small" type="text" value="0.00"></td>
                <td><input class="input-small" type="text" value="0.00"></td>
                <!-- F and P -->
                <td><input class="checkbox" type="checkbox"></td>
                <td><input class="checkbox" type="checkbox"></td>
                <!-- Weight Air and Water -->
                <td><input class="input-medium" type="text" oninput="validateWeightAir(this)" onblur="validateWeightAir(this)" onkeyup="checkWeightAirComplete(this)"></td>
                <td><input class="input-medium" type="text" oninput="validateWater(this)" onblur="validateWater(this)"></td>
                <!-- Release? -->
                <td><input class="checkbox" type="checkbox"></td>
                <!-- Max Load -->
                <td><input class="input-medium" type="text"></td>
                <!-- Tested? -->
                <td><input class="checkbox" type="checkbox"></td>
                <!-- Action -->
                <td><button class="red-button" onclick="removeRow(this)">✖</button></td>
            `;

            if (currentNominal) {
                applyToRow(newRow, currentNominal);
            }

            tbody.appendChild(newRow);
            cubeCount++;
            document.getElementById('counter').textContent = cubeCount;

            cubeIdInput.value = '';
            cubeIdInput.focus();
        }

        function syncNominal(input) {
            const row = input.closest('tr');
            const value = input.value.trim();

            if (value === '100' || value === '150') {
                row.cells[1].querySelector('input').value = value;
                row.cells[4].querySelector('input').value = value;
                row.cells[7].querySelector('input').value = value;
            } else {
                row.cells[1].querySelector('input').value = '';
                row.cells[4].querySelector('input').value = '';
                row.cells[7].querySelector('input').value = '';
            }
        }

        function checkWeightAirComplete(weightAirInput) {
            const row = weightAirInput.closest('tr');
            const nominalInput = row.cells[0].querySelector('.nominal-input');
            const nominalValue = nominalInput.value.trim();
            const weightAir = weightAirInput.value.trim();

            // Se não for 100 ou 150, não faz nada
            if (nominalValue !== '100' && nominalValue !== '150') {
                return;
            }

            // Só processa se tiver exatamente 4 dígitos numéricos
            if (weightAir.length !== 4 || isNaN(weightAir)) {
                return; // Não faz nada se incompleto ou inválido
            }

            const num = parseInt(weightAir);

            if (nominalValue === '100') {
                if (num < 2300) {
                    // Aplica 98
                    row.cells[1].querySelector('input').value = '98';
                    row.cells[2].querySelector('input').value = '98';
                    row.cells[3].querySelector('input').value = '98';
                } else if (num > 2450) {
                    // Aplica 102
                    row.cells[1].querySelector('input').value = '102';
                    row.cells[2].querySelector('input').value = '102';
                    row.cells[3].querySelector('input').value = '102';
                } else {
                    // Está na faixa normal → volta ao valor original
                    row.cells[1].querySelector('input').value = '100';
                    row.cells[2].querySelector('input').value = '0.00';
                    row.cells[3].querySelector('input').value = '0.00';
                }
            } else if (nominalValue === '150') {
                if (num < 7650) {
                    // Aplica 148
                    row.cells[1].querySelector('input').value = '148';
                    row.cells[2].querySelector('input').value = '148';
                    row.cells[3].querySelector('input').value = '148';
                } else if (num > 8250) {
                    // Aplica 152
                    row.cells[1].querySelector('input').value = '152';
                    row.cells[2].querySelector('input').value = '152';
                    row.cells[3].querySelector('input').value = '152';
                } else {
                    // Está na faixa normal → volta ao valor original
                    row.cells[1].querySelector('input').value = '150';
                    row.cells[2].querySelector('input').value = '0.00';
                    row.cells[3].querySelector('input').value = '0.00';
                }
            }
        }

        function applyToRow(row, value) {
            row.cells[0].querySelector('.nominal-input').value = value;
            row.cells[1].querySelector('input').value = value;
            row.cells[4].querySelector('input').value = value;
            row.cells[7].querySelector('input').value = value;
        }

        function applyGlobalNominal() {
            currentNominal = document.getElementById('globalNominal').value;
        }

        function toggleAll(column) {
            const isChecked = document.getElementById(`selectAll${column}`).checked;
            const rows = document.querySelectorAll('#tableBody tr');
            const columnIndex = column === 'F' ? 10 : 11;

            rows.forEach(row => {
                const checkbox = row.cells[columnIndex].querySelector('input[type="checkbox"]');
                if (checkbox) {
                    checkbox.checked = isChecked;
                }
            });
        }

        // Validação para Weight Air: exatamente 4 dígitos inteiros
        function validateWeightAir(input) {
            let value = input.value.replace(/[^0-9]/g, '');

            if (value.length > 4) {
                value = value.slice(0, 4);
            }

            input.value = value;

            if (value.length !== 4) {
                input.classList.add('invalid');
            } else {
                input.classList.remove('invalid');
            }
        }

        // Validação para Water: exatamente 4 dígitos (sem ponto)
        function validateWater(input) {
            let value = input.value.replace(/[^0-9]/g, '');

            if (value.length > 4) {
                value = value.slice(0, 4);
            }

            input.value = value;

            if (value.length !== 4) {
                input.classList.add('invalid');
            } else {
                input.classList.remove('invalid');
            }
        }

        function lookupBatch() {
            const batchId = document.getElementById('batchId').value.trim();
            if (batchId === '') {
                alert('Please enter a Batch ID.');
                return;
            }
            alert(`🔍 Searching all cubes for Batch: ${batchId}\n(This function can be expanded later)`);
        }

        function removeRow(button) {
            const row = button.closest('tr');
            row.remove();
            cubeCount = Math.max(0, cubeCount - 1);
            document.getElementById('counter').textContent = cubeCount;
        }

        function saveResults() {
            const rows = document.querySelectorAll('#tableBody tr');
            if (rows.length === 0) {
                alert('⚠️ No cubes added.');
                return;
            }

            let data = [];
            let hasInvalid = false;

            rows.forEach(row => {
                const cubeId = row.cells[0].querySelector('.id-text').innerText.split('\n')[0];
                const width = [
                    row.cells[1].querySelector('input').value,
                    row.cells[2].querySelector('input').value,
                    row.cells[3].querySelector('input').value
                ];
                const height = [
                    row.cells[4].querySelector('input').value,
                    row.cells[5].querySelector('input').value,
                    row.cells[6].querySelector('input').value
                ];
                const length = [
                    row.cells[7].querySelector('input').value,
                    row.cells[8].querySelector('input').value,
                    row.cells[9].querySelector('input').value
                ];
                const f = row.cells[10].querySelector('input').checked ? 'Yes' : 'No';
                const p = row.cells[11].querySelector('input').checked ? 'Yes' : 'No';

                const weightAirInput = row.cells[12].querySelector('input');
                const waterInput = row.cells[13].querySelector('input');
                const weightAir = weightAirInput.value;
                const water = waterInput.value;

                if (weightAir.length !== 4 || isNaN(weightAir)) {
                    weightAirInput.classList.add('invalid');
                    hasInvalid = true;
                } else {
                    weightAirInput.classList.remove('invalid');
                }

                if (water.length !== 4 || isNaN(water)) {
                    waterInput.classList.add('invalid');
                    hasInvalid = true;
                } else {
                    waterInput.classList.remove('invalid');
                }

                const release = row.cells[14].querySelector('input').checked ? 'Yes' : 'No';
                const maxLoad = row.cells[15].querySelector('input').value;
                const tested = row.cells[16].querySelector('input').checked ? 'Yes' : 'No';

                data.push({
                    cubeId,
                    width,
                    height,
                    length,
                    f,
                    p,
                    weightAir,
                    water,
                    release,
                    maxLoad,
                    tested
                });
            });

            if (hasInvalid) {
                alert('⚠️ Some Weight Air or Water fields are invalid. Both must be exactly 4 digits.');
                return;
            }

            console.log('Collected ', data);
            alert(`✅ ${data.length} cube(s) ready to send!\nCheck console (F12) for details.`);
        }

        function sendResults() {
            const count = document.querySelectorAll('#tableBody tr').length;
            if (count === 0) {
                alert('⚠️ No cubes added to send.');
                return;
            }
            alert(`📤 Sending ${count} cube(s) to system...\n\n✅ Simulation: Data sent successfully!`);
        }
    </script>

</body>
</html>
