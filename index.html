<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Concrete Cube Testing - Result Entry (Simulation)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .header {
            background-color: #3a5a6b;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .logo {
            font-size: 48px;
            font-weight: bold;
            color: #00994d;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
        }
        .user-info {
            text-align: right;
            font-size: 14px;
        }
        .search-bar {
            background-color: #e6d07c;
            padding: 10px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            margin: 20px;
            border-radius: 4px;
        }
        .search-bar label {
            font-weight: bold;
            min-width: 80px;
        }
        .search-bar input {
            padding: 6px;
            width: 180px;
            border: 1px solid #999;
            border-radius: 3px;
        }
        .search-bar button {
            padding: 6px 12px;
            background-color: #fff;
            border: 1px solid #999;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-bar button:hover {
            background-color: #eee;
        }
        table {
            width: 95%;
            border-collapse: collapse;
            margin: 20px auto;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            font-size: 14px;
        }
        th, td {
            padding: 8px;
            text-align: center;
            border: 1px solid #ddd;
        }
        th {
            background-color: white;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 1px solid #000;
        }
        #resultsTable {
            border-top: 1px solid #000;
        }
        .red-button {
            background-color: #cc0000;
            color: white;
            border: none;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
        }
        .red-button:hover {
            background-color: #aa0000;
        }
        .checkbox {
            width: 18px;
            height: 18px;
            accent-color: #007bff;
        }
        .input-small {
            width: 25px;
            text-align: center;
            padding: 2px;
            border: 1px solid #000;
            border-radius: 0;
            font-size: 12px;
            margin: 0;
            box-sizing: border-box;
        }
        .input-medium {
            width: 60px;
            text-align: center;
            padding: 2px;
            border: 1px solid #ccc;
            border-radius: 2px;
        }
        .cube-id {
            font-weight: bold;
            text-align: left;
            padding-left: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .footer {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #777;
            margin-top: 20px;
        }
        .btn-save {
            background-color: #007bff;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin: 5px;
        }
        .btn-save:hover {
            background-color: #0056b3;
        }
        .btn-send {
            background-color: #28a745;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin: 5px;
        }
        .btn-send:hover {
            background-color: #218838;
        }
        td input {
            display: inline-block;
            margin: 0;
            padding: 2px;
            border: 1px solid #000;
            border-radius: 0;
            box-sizing: border-box;
        }
        td {
            padding: 0;
        }
        .global-nominal {
            background-color: #f9f9f9;
            padding: 4px;
            border: 1px solid #999;
            border-radius: 3px;
            font-size: 14px;
            margin-right: 10px;
        }
        .header-checkbox {
            width: 18px;
            height: 18px;
            accent-color: #007bff;
        }
        /* Estilo para campo inválido */
        .invalid {
            border: 2px solid #ff4d4d !important;
        }
        .nominal-input {
            width: 25px;
            text-align: center;
            padding: 2px;
            border: 1px solid #000;
            border-radius: 0;
            font-size: 12px;
            margin: 0;
            box-sizing: border-box;
        }
        /* Alinhar a caixa azul ao centro da célula */
        .cube-id-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">3HP</div>
        <div class="title">Concrete Cube Testing - Result Entry (Measurement)</div>
        <div class="user-info">
            <span id="counter">0</span>/234 cubes tested
        </div>
    </div>

    <div class="search-bar">
        <label>Cube ID:</label>
        <input type="text" id="cubeId">
        <button onclick="findCube()">Find...</button>
        <span style="flex-grow:1;"></span>
        <label>Batch ID:</label>
        <input type="text" id="batchId">
        <button onclick="lookupBatch()">Lookup...</button>
    </div>

    <div style="margin: 0 20px 10px; display: flex; align-items: center;">
        <label style="font-weight: bold; margin-right: 5px;">Nominal Value:</label>
        <select class="global-nominal" id="globalNominal" onchange="applyGlobalNominal()">
            <option value="">Select...</option>
            <option value="100">100</option>
            <option value="150">150</option>
        </select>
    </div>

    <table id="resultsTable">
        <thead>
            <tr>
                <th>Cube ID</th>
                <th colspan="3">Width</th>
                <th colspan="3">Height</th>
                <th colspan="3">Length</th>
                <th>
                    F<br>
                    <input type="checkbox" class="header-checkbox" id="selectAllF" onclick="toggleAll('F')">
                </th>
                <th>
                    P<br>
                    <input type="checkbox" class="header-checkbox" id="selectAllP" onclick="toggleAll('P')">
                </th>
                <th>Weight Air</th>
                <th>Water</th>
                <th>Release?</th>
                <th>Max Load</th>
                <th>Tested?</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>

    <div style="text-align: center; margin: 20px;">
        <button class="btn-save" onclick="saveResults()">💾 Save</button>
        <button class="btn-send" onclick="sendResults()">📤 Send</button>
    </div>

    <div class="footer">
        Simulation for training and personal improvement — © 2025 | For internal use only
    </div>

    <script>
        let cubeCount = 0;
        let currentNominal = '';

        function findCube() {
            const cubeIdInput = document.getElementById('cubeId');
            const cubeId = cubeIdInput.value.trim();

            if (cubeId === '') {
                alert('⚠️ Please enter a valid Cube ID.');
                return;
            }

            if (!cubeId.includes('.')) {
                alert('⚠️ Format expected: XXXXX.X (e.g., 01234.5)');
                return;
            }

            let strength = '40N';
            const lastPart = cubeId.split('.').pop();
            if (lastPart && !isNaN(lastPart)) {
                const num = parseInt(lastPart);
                if (num % 3 === 0) strength = '35N';
                else if (num % 5 === 0) strength = '55N';
            }

            const tbody = document.getElementById('tableBody');
            const newRow = document.createElement('tr');

            newRow.innerHTML = `
                <td class="cube-id">
                    <div class="cube-id-container">
                        <span>${cubeId}<br><small>(${strength})</small></span>
                        <input class="nominal-input" type="text" value="${currentNominal || ''}" oninput="syncNominal(this)">
                    </div>
                </td>
                <!-- Width: 3 campos -->
                <td><input class="input-small" type="text"></td>
                <td><input class="input-small" type="text" value="0.00"></td>
                <td><input class="input-small" type="text" value="0.00"></td>
                <!-- Height: 3 campos -->
                <td><input class="input-small" type="text"></td>
                <td><input class="input-small" type="text" value="0.00"></td>
                <td><input class="input-small" type="text" value="0.00"></td>
                <!-- Length: 3 campos -->
                <td><input class="input-small" type="text"></td>
                <td><input class="input-small" type="text" value="0.00"></td>
                <td><input class="input-small" type="text" value="0.00"></td>
                <!-- F and P -->
                <td><input class="checkbox" type="checkbox"></td>
                <td><input class="checkbox" type="checkbox"></td>
                <!-- Weight Air and Water -->
                <td><input class="input-medium" type="text" oninput="validateWeightAir(this)" onblur="autoFillWidthByWeightAir(this)"></td>
                <td><input class="input-medium" type="text" oninput="validateWater(this)" onblur="validateWater(this)"></td>
                <!-- Release? -->
                <td><input class="checkbox" type="checkbox"></td>
                <!-- Max Load -->
                <td><input class="input-medium" type="text"></td>
                <!-- Tested? -->
                <td><input class="checkbox" type="checkbox"></td>
                <!-- Action -->
                <td><button class="red-button" onclick="removeRow(this)">✖</button></td>
            `;

            // Aplica o valor nominal global à linha (na caixa dentro do Cube ID)
            if (currentNominal) {
                applyToRow(newRow, currentNominal);
            }

            tbody.appendChild(newRow);
            cubeCount++;
            document.getElementById('counter').textContent = cubeCount;

            cubeIdInput.value = '';
            cubeIdInput.focus();
        }

        function syncNominal(input) {
            const row = input.closest('tr');
            const nominal = input.value.trim();

            if (nominal === '100' || nominal === '150') {
                // Aplica o valor nas 1ª caixas de Width, Height e Length
                row.cells[1].querySelector('input').value = nominal;
                row.cells[4].querySelector('input').value = nominal;
                row.cells[7].querySelector('input').value = nominal;
            } else {
                // Se não for 100 ou 150, deixa as caixas em branco
                row.cells[1].querySelector('input').value = '';
                row.cells[4].querySelector('input').value = '';
                row.cells[7].querySelector('input').value = '';
            }
        }

        function applyToRow(row, value) {
            // Aplica o valor na caixa dentro do Cube ID
            const nominalInput = row.cells[0].querySelector('input');
            if (nominalInput) {
                nominalInput.value = value;
            }

            // Aplica o valor nas 1ª caixas de Width, Height e Length
            row.cells[1].querySelector('input').value = value;
            row.cells[4].querySelector('input').value = value;
            row.cells[7].querySelector('input').value = value;
        }

        function applyGlobalNominal() {
            currentNominal = document.getElementById('globalNominal').value;
        }

        function toggleAll(column) {
            const isChecked = document.getElementById(`selectAll${column}`).checked;
            const rows = document.querySelectorAll('#tableBody tr');
            const columnIndex = column === 'F' ? 11 : 12;

            rows.forEach(row => {
                const checkbox = row.cells[columnIndex].querySelector('input[type="checkbox"]');
                if (checkbox) {
                    checkbox.checked = isChecked;
                }
            });
        }

        // Validação para Weight Air: exatamente 4 dígitos inteiros
        function validateWeightAir(input) {
            let value = input.value.replace(/[^0-9]/g, ''); // Remove tudo que não for número

            if (value.length > 4) {
                value = value.slice(0, 4); // Limita a 4 dígitos
            }

            input.value = value;

            // Adiciona classe "invalid" se não tiver exatamente 4 dígitos
            if (value.length !== 4) {
                input.classList.add('invalid');
            } else {
                input.classList.remove('invalid');
            }
        }

        // Validação para Water: máximo de 4 dígitos (com ou sem ponto decimal)
        function validateWater(input) {
            let value = input.value;

            // Permite apenas números e um único ponto
            value = value.replace(/[^\d.]/g, '');
            value = value.replace(/\.{2,}/g, '.');

            // Se começar com ponto, adiciona zero
            if (value.startsWith('.')) {
                value = '0' + value;
            }

            // Se terminar com ponto, remove
            if (value.endsWith('.')) {
                value = value.slice(0, -1);
            }

            // Limita a 4 dígitos no total (ignorando o ponto)
            const digitsOnly = value.replace('.', '');
            if (digitsOnly.length > 4) {
                // Mantém só os primeiros 4 dígitos
                const firstFour = digitsOnly.slice(0, 4);
                // Reconstrói mantendo o ponto se existir
                if (value.includes('.')) {
                    const [intPart, decPart] = value.split('.');
                    let newInt = intPart;
                    let newDec = decPart || '';
                    // Distribui os 4 dígitos entre parte inteira e decimal
                    if (newInt.length + newDec.length > 4) {
                        const total = (newInt + newDec).slice(0, 4);
                        newInt = total.slice(0, intPart.length);
                        newDec = total.slice(intPart.length);
                        // Remove zeros à direita da parte decimal
                        newDec = newDec.replace(/0+$/, '');
                        value = newDec ? newInt + '.' + newDec : newInt;
                    } else {
                        value = newInt + (newDec ? '.' + newDec : '');
                    }
                } else {
                    value = firstFour;
                }
            }

            input.value = value;

            // Valida se tem pelo menos 3 dígitos
            if (digitsOnly.length < 3) {
                input.classList.add('invalid');
            } else {
                input.classList.remove('invalid');
            }
        }

        // Nova função: Auto-fill Width based on Weight Air
        function autoFillWidthByWeightAir(input) {
            const row = input.closest('tr');
            const weightAir = parseInt(input.value) || 0;

            // Obter o valor nominal da caixa dentro do Cube ID
            const nominalInput = row.cells[0].querySelector('input');
            const nominalWidth = nominalInput ? parseInt(nominalInput.value) || 0 : 0;

            let newValue = nominalWidth; // Valor padrão

            if (nominalWidth === 100) {
                if (weightAir < 2300) {
                    newValue = 98;
                } else if (weightAir > 2450) {
                    newValue = 102;
                }
            } else if (nominalWidth === 150) {
                if (weightAir < 7650) {
                    newValue = 148;
                } else if (weightAir > 8250) {
                    newValue = 152;
                }
            }

            // Aplica o novo valor nas 3 caixas de Width (colunas 1, 2 e 3 da linha)
            row.cells[1].querySelector('input').value = newValue;
            row.cells[2].querySelector('input').value = newValue;
            row.cells[3].querySelector('input').value = newValue;
        }

        function lookupBatch() {
            const batchId = document.getElementById('batchId').value.trim();
            if (batchId === '') {
                alert('Please enter a Batch ID.');
                return;
            }
            alert(`🔍 Searching all cubes for Batch: ${batchId}\n(This function can be expanded later)`);
        }

        function removeRow(button) {
            const row = button.closest('tr');
            row.remove();
            cubeCount = Math.max(0, cubeCount - 1);
            document.getElementById('counter').textContent = cubeCount;
        }

        function saveResults() {
            const rows = document.querySelectorAll('#tableBody tr');
            if (rows.length === 0) {
                alert('⚠️ No cubes added.');
                return;
            }

            let data = [];
            let hasInvalid = false;

            rows.forEach(row => {
                const cubeId = row.cells[0].innerText.split('\n')[0];
                const width = [
                    row.cells[1].querySelector('input').value,
                    row.cells[2].querySelector('input').value,
                    row.cells[3].querySelector('input').value
                ];
                const height = [
                    row.cells[4].querySelector('input').value,
                    row.cells[5].querySelector('input').value,
                    row.cells[6].querySelector('input').value
                ];
                const length = [
                    row.cells[7].querySelector('input').value,
                    row.cells[8].querySelector('input').value,
                    row.cells[9].querySelector('input').value
                ];
                const f = row.cells[10].querySelector('input').checked ? 'Yes' : 'No';
                const p = row.cells[11].querySelector('input').checked ? 'Yes' : 'No';

                // Valida Weight Air e Water
                const weightAirInput = row.cells[12].querySelector('input');
                const waterInput = row.cells[13].querySelector('input');
                const weightAir = weightAirInput.value;
                const water = waterInput.value;

                // Validar Weight Air: exatamente 4 dígitos
                if (weightAir.length !== 4 || isNaN(weightAir)) {
                    weightAirInput.classList.add('invalid');
                    hasInvalid = true;
                } else {
                    weightAirInput.classList.remove('invalid');
                }

                // Validar Water: pelo menos 3 dígitos (com ou sem ponto)
                const waterDigits = water.replace('.', '');
                if (waterDigits.length < 3 || water === '') {
                    waterInput.classList.add('invalid');
                    hasInvalid = true;
                } else {
                    waterInput.classList.remove('invalid');
                }

                const release = row.cells[14].querySelector('input').checked ? 'Yes' : 'No';
                const maxLoad = row.cells[15].querySelector('input').value;
                const tested = row.cells[16].querySelector('input').checked ? 'Yes' : 'No';

                data.push({
                    cubeId,
                    width,
                    height,
                    length,
                    f,
                    p,
                    weightAir,
                    water,
                    release,
                    maxLoad,
                    tested
                });
            });

            if (hasInvalid) {
                alert('⚠️ Some Weight Air or Water fields are invalid. Weight Air must be exactly 4 digits. Water must have at least 3 digits (with or without decimal point).');
                return;
            }

            console.log('Collected ', data);
            alert(`✅ ${data.length} cube(s) ready to send!\nCheck console (F12) for details.`);
        }

        function sendResults() {
            const count = document.querySelectorAll('#tableBody tr').length;
            if (count === 0) {
                alert('⚠️ No cubes added to send.');
                return;
            }
            alert(`📤 Sending ${count} cube(s) to system...\n\n✅ Simulation: Data sent successfully!`);
        }
    </script>

</body>
</html>
